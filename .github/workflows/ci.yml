name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contrast and status-family check
        run: npm run check
      - name: dist/ is up to date with tokens.json
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/ is stale: run npm run build and commit" && exit 1)
